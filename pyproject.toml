[project]
name = "yt-subtitle"
version = "0.1.0"
description = "Transcribe YouTube audio into plain and timestamped text locally"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.0",
    # faster-whisper 1.2.1 passes metadata_errors, removed in PyAV 19.
    "av>=11,<19",
    # Newer cuBLAS releases currently lack Windows wheels.
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12,<13; sys_platform == 'win32'",
]

[project.scripts]
yt-subtitle = "yt_subtitle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/yt_subtitle", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_subtitle"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
